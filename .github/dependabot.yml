version: 2

# Dependabot config goals:
# - Keep PR noise low (group patch/minor updates)
# - Keep security fixes fast
# - Cover: GitHub Actions, Python (pip requirements), frontend (npm), Docker images

updates:
  # ────────────────────────────────────────────────────────────────────────────
  # GitHub Actions
  # ────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # ────────────────────────────────────────────────────────────────────────────
  # Python — backend requirements.txt
  # ────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python — root test/dev requirements-test.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "UTC"
    open-pull-requests-limit: 3
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-test:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend — npm
  # ────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ────────────────────────────────────────────────────────────────────────────
  # Docker images — root docker-compose.yml (redis, etc.)
  # ────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-root:
        patterns:
          - "*"

  # Docker images — backend Dockerfile base image
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-backend:
        patterns:
          - "*"

  # Docker images — frontend Dockerfile base image
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:50"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-frontend:
        patterns:
          - "*"

