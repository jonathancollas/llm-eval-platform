name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-redroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies (for mypy imports)
        run: pip install -r backend/requirements.txt
      - name: Install ruff + mypy
        run: pip install ruff==0.15.12 mypy==1.20.2
      - name: Ruff check (redroom package — strict)
        run: ruff check backend/eval_engine/redroom backend/tests/test_redroom_*.py
      - name: Mypy on redroom package
        run: cd backend && PYTHONPATH=. mypy eval_engine/redroom

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: make test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
